<!doctype html>
<html>
  <body style="margin:0;padding:24px;background:#f4f4f5;font-family:-apple-system,Segoe UI,Helvetica,Arial,sans-serif;color:#18181b;">
    <div style="max-width:480px;margin:0 auto;background:#ffffff;border-radius:8px;padding:24px;">
      <p style="margin:0 0 16px;font-size:18px;font-weight:600;">{{ site_name }}</p>
      {% block content %}{% endblock %}
    </div>
    <p style="max-width:480px;margin:16px auto 0;font-size:12px;color:#71717a;">
      {% block footer %}You received this mail because of activity on your {{ site_name }} account.{% endblock %}
    </p>
  </body>
</html>
