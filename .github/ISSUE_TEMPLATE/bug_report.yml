name: Bug report
description: Something in bitjournal does not work as expected
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. This form is for bugs only.
        Feature requests belong in [discussions](https://github.com/simon-mettler/bitjournal/discussions), and security problems must be reported privately as described in [SECURITY.md](https://github.com/simon-mettler/bitjournal/blob/main/SECURITY.md).

        Please remove personal data from logs and screenshots before posting.
  - type: checkboxes
    id: checks
    attributes:
      label: Before you submit
      options:
        - label: I searched existing issues and this bug has not been reported yet.
          required: true
        - label: I checked the [troubleshooting page](https://bitjournal.me/docs/selfhost/troubleshooting) if I self-host.
          required: true
        - label: I wrote this report myself and tested the steps below.
          required: true
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear description of the bug.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Go to ...
        2. Click on ...
        3. See the error
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: bitjournal version
      description: Shown at the bottom of the navigation menu, for example v0.1.1.
      placeholder: v0.1.1
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: How do you run bitjournal?
      options:
        - Self-hosted with Docker Compose
        - Development setup
        - Other
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Browser and device
      description: Browser, version, operating system, and whether you use the installed app (PWA).
      placeholder: Firefox 150 on Android 17, installed as app
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs and screenshots
      description: |
        Browser console output, or server logs from `docker compose logs --tail 100 <app container>`.
        Remove secrets and personal data first.
      render: shell
  - type: textarea
    id: extra
    attributes:
      label: Anything else?
