version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']

  - package-ecosystem: pip
    directory: /backend
    schedule:
      interval: weekly
    groups:
      backend-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    groups:
      frontend-minor-patch:
        update-types: [minor, patch]

  # Base images in the Dockerfile.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly

  # postgres image in the compose files. Major upgrades need a dump and restore,
  # so those are done by hand.
  - package-ecosystem: docker-compose
    directories: [/, /deploy]
    schedule:
      interval: weekly
    ignore:
      - dependency-name: postgres
        update-types: [version-update:semver-major]
